<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stage 32">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tubenfunk Stage 32</title>
<style>
:root{--page:#cfd1d4;--ink:#1a1a1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0d0d0f;--ink:#e8e8ea}}
:root[data-theme="dark"]{--page:#0d0d0f;--ink:#e8e8ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:6px;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.case{width:100%;max-width:none;border-radius:14px;padding:14px 14px 0;background:repeating-linear-gradient(45deg,#1b1c1e 0 2px,#202123 2px 4px);box-shadow:0 0 0 2px #0a0a0b,inset 0 2px 0 #3a3b3e,0 24px 50px rgba(0,0,0,.55)}
.panel{border-radius:8px;padding:12px 14px 12px;background:linear-gradient(#d4d7da,#aeb2b6 55%,#c3c6c9);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 #7b7f83,0 3px 8px rgba(0,0,0,.6);color:#1d1e20}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.logo{font:italic 700 22px "Avenir Next","Helvetica Neue",Arial,sans-serif;letter-spacing:.02em;color:#1d1e20}
.logo small{font-style:italic;font-weight:400;font-size:12px;display:block;margin-top:-2px;color:#4a4d51}
.lcd{flex:0 1 380px;min-width:0;height:54px;border-radius:5px;background:#120a04;box-shadow:inset 0 0 0 2px #5b5f63,inset 0 3px 10px #000;color:#ffa42e;text-shadow:0 0 8px rgba(255,150,30,.7);font:600 17px "Courier New",monospace;padding:6px 12px;display:flex;flex-direction:column;justify-content:center}
.lcd .b{height:5px;margin-top:5px;background:#3a2108;border-radius:3px;overflow:hidden}
.lcd .b i{display:block;height:100%;width:0;background:#ffa42e;box-shadow:0 0 6px #ffa42e}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 6px;align-items:flex-start}
.kw{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;min-width:64px}
.knob{width:54px;height:54px;border-radius:50%;touch-action:none;cursor:ns-resize;outline:none;background:radial-gradient(circle at 35% 30%,#4a4c50,#141416 70%);box-shadow:0 4px 7px rgba(0,0,0,.6),0 0 0 2px #0c0c0d,0 0 0 4px #8a8e92;position:relative}
.knob::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:16px;margin-left:-1.5px;border-radius:2px;background:#ff8a1f}
.knob:focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 6px #ff8a1f}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.seg{display:inline-flex;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px #4a4d51}
.seg button,.t{font:600 13px "Avenir Next","Helvetica Neue",Arial,sans-serif;padding:9px 13px;border:0;background:linear-gradient(#e4e6e8,#b7babd);color:#1d1e20;cursor:pointer;border-right:1px solid #8a8e92;min-height:40px}
.seg button:last-child{border-right:0}
.seg button.on,.t.on{background:linear-gradient(#ff9d3d,#e0700f);color:#1a0d02;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.t{border-radius:6px;box-shadow:0 0 0 1px #4a4d51}
.lab{font-size:12px;font-weight:600;color:#3a3d41}
button:focus-visible{outline:2px solid #ff8a1f;outline-offset:2px}
.felt{height:7px;margin-top:12px;background:#7b1d1d;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.kbd{position:relative;display:flex;height:clamp(220px,50vh,440px);background:#111;touch-action:none;margin:0 -2px}
.k{position:relative}
.w{flex:1;background:linear-gradient(#f4f1e8,#e6e2d4 85%,#cfcab8);border:1px solid #6e6a5c;border-top:0;border-radius:0 0 4px 4px;display:flex;align-items:flex-end;justify-content:center;font-size:10px;color:#7a7568;padding-bottom:4px;transition:transform .05s}
.w.d{background:linear-gradient(#d9d4c3,#bdb7a2);transform:translateY(2px)}
.bk{position:absolute;top:0;height:62%;z-index:2;background:linear-gradient(90deg,#222,#050505 50%,#262626);border-radius:0 0 3px 3px;box-shadow:0 4px 5px rgba(0,0,0,.6),inset 0 -6px 4px rgba(255,255,255,.08)}
.bk.d{background:linear-gradient(#000,#1a1a1a);height:63%;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.hint{font-size:11px;color:#9a9da1;text-align:center;padding:7px 0 9px;background:#1b1c1e}
</style>
</head>
<body>
<main class="case">
  <section class="panel">
    <div class="top">
      <div class="logo">Tubenfunk Stage 32<small>Elektrisches Klavier</small></div>
      <div class="lcd"><div id="l1">Bereit. Spiel eine Taste.</div><div class="b"><i id="vb"></i></div></div>
    </div>
    <div class="row" id="knobs"></div>
    <div class="btns">
      <span class="lab">Klang</span><div class="seg" id="segType"><button data-v="rhodes" class="on">Röhre</button><button data-v="wurli">Rohrblatt</button><button data-v="glocke">Glocke</button></div>
      <span class="lab">Raum</span><div class="seg" id="segRoom"><button data-v="0.9">Studio</button><button data-v="2.4" class="on">Saal</button><button data-v="5">Kathedrale</button></div>
      <span class="lab">Oktave</span><div class="seg"><button id="oM">−</button><button id="oP">+</button></div>
      <button class="t" id="sus">Haltepedal</button>
    </div>
  </section>
  <div class="felt"></div>
  <div class="kbd" id="kbd" role="group" aria-label="Klaviatur mit 32 Tasten"></div>
  <div class="hint">Je weiter unten du eine Taste berührst, desto lauter und heller klingt der Anschlag.</div>
</main>
<script>
(function(){
var $=function(s){return document.querySelector(s)};
var LO=48,HI=79; // C3 bis G5: 32 Tasten
var NN=["C","C#","D","D#","E","F","F#","G","G#","A","A#","H"];
var NNE=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
function nm(m){return NNE[m%12]+(Math.floor(m/12)-1)}
var S={vol:.7,rev:.35,rep:.0,time:.4,trem:.0,tone:.7,type:"rhodes",room:2.4,oct:0,sus:false};
try{var sv=JSON.parse(localStorage.getItem("stage64")||"null");if(sv)for(var k in sv)if(k in S&&k!=="sus")S[k]=sv[k]}catch(e){}
function save(){try{localStorage.setItem("stage64",JSON.stringify(S))}catch(e){}}

var TYPES={
 rhodes:{wave:"sine",r1:1,i1:[.45,1.9],r2:14,i2:[.03,.13],bd:.09,tau:[2.6,.9]},
 wurli:{wave:"triangle",r1:2,i1:[.3,1.6],r2:5,i2:[.03,.12],bd:.05,tau:[1.5,.5]},
 glocke:{wave:"sine",r1:3.5,i1:[.8,2.6],r2:7,i2:[.08,.28],bd:.2,tau:[3.4,1.5]}
};

// Audio
var ctx,tone,tg,lfo,lg,bus,dry,conv,revG,dSend,dly,fb,dOut,master,noiseBuf;
function ir(sec){
  var sr=ctx.sampleRate,len=Math.floor(sr*sec),b=ctx.createBuffer(2,len,sr);
  for(var c=0;c<2;c++){var d=b.getChannelData(c),lp=0;for(var i=0;i<len;i++){var t=i/len;lp+=(Math.random()*2-1-lp)*(.7-.5*t);d[i]=lp*Math.pow(1-t,2.6)*(i<sr*.012?i/(sr*.012):1)}}
  return b;
}
function ensure(){
  if(ctx){if(ctx.state==="suspended")ctx.resume();return}
  var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC({latencyHint:"interactive"});
  var comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.knee.value=18;comp.connect(ctx.destination);
  master=ctx.createGain();master.connect(comp);
  tone=ctx.createBiquadFilter();tone.type="lowpass";tone.Q.value=.5;
  tg=ctx.createGain();lfo=ctx.createOscillator();lfo.frequency.value=5.4;lg=ctx.createGain();lfo.connect(lg);lg.connect(tg.gain);lfo.start();
  bus=ctx.createGain();tone.connect(tg);tg.connect(bus);
  dry=ctx.createGain();bus.connect(dry);dry.connect(master);
  conv=ctx.createConvolver();conv.buffer=ir(S.room);revG=ctx.createGain();bus.connect(conv);conv.connect(revG);revG.connect(master);
  dSend=ctx.createGain();dly=ctx.createDelay(1.5);fb=ctx.createGain();var dm=ctx.createBiquadFilter();dm.type="lowpass";dm.frequency.value=2800;dOut=ctx.createGain();
  bus.connect(dSend);dSend.connect(dly);dly.connect(dm);dm.connect(fb);fb.connect(dly);dm.connect(dOut);dOut.connect(master);dOut.connect(conv);
  var nl=ctx.sampleRate*.08;noiseBuf=ctx.createBuffer(1,nl,ctx.sampleRate);var nd=noiseBuf.getChannelData(0);for(var i=0;i<nl;i++)nd[i]=Math.random()*2-1;
  apply();
}
function apply(){
  if(!ctx)return;var t=ctx.currentTime;
  master.gain.setTargetAtTime(S.vol*S.vol*1.3,t,.02);
  tone.frequency.setTargetAtTime(500*Math.pow(30,S.tone),t,.02);
  var dep=S.trem*.8;tg.gain.setTargetAtTime(1-dep/2,t,.02);lg.gain.setTargetAtTime(dep/2,t,.02);
  revG.gain.setTargetAtTime(S.rev*1.3,t,.03);dry.gain.setTargetAtTime(1-S.rev*.25,t,.03);
  dSend.gain.setTargetAtTime(S.rep*.9,t,.03);dOut.gain.setTargetAtTime(S.rep>.01?.8:0,t,.03);
  fb.gain.setTargetAtTime(Math.min(.72,.22+S.rep*.5),t,.03);dly.delayTime.setTargetAtTime(.09+S.time*.7,t,.05);
}

var voices={},live=[],pedal=false;
function relv(v){
  if(v.gone)return;v.gone=true;var t=ctx.currentTime,f=v.f,rt=.07+.25*Math.max(0,1-(f-65)/900);
  v.rel.gain.setTargetAtTime(0,t,rt);
  var st=t+rt*7;[v.c,v.o1,v.o2].forEach(function(o){try{o.stop(st)}catch(e){}});
  v.c.onended=function(){try{v.rel.disconnect()}catch(e){}};
  var i=live.indexOf(v);if(i>=0)live.splice(i,1);
}
function on(m,vel){
  ensure();var old=voices[m];if(old){old.down=false;relv(old)}
  if(live.length>44)relv(live[0]);
  var T=TYPES[S.type],t=ctx.currentTime,f=440*Math.pow(2,(m+S.oct*12-69)/12),p=Math.min(1,Math.max(0,(m-LO)/(HI-LO)));
  var tau=T.tau[0]+(T.tau[1]-T.tau[0])*p;
  var c=ctx.createOscillator();c.type=T.wave;c.frequency.value=f;
  var o1=ctx.createOscillator(),g1=ctx.createGain(),o2=ctx.createOscillator(),g2=ctx.createGain();
  o1.frequency.value=f*T.r1;o2.frequency.value=f*T.r2;
  var d1=(T.i1[0]+(T.i1[1]-T.i1[0])*vel)*f*T.r1,d2=(T.i2[0]+(T.i2[1]-T.i2[0])*vel*vel)*f*T.r2;
  g1.gain.setValueAtTime(d1,t);g1.gain.setTargetAtTime(d1*.14,t,tau*.22);
  g2.gain.setValueAtTime(d2,t);g2.gain.setTargetAtTime(0,t,T.bd);
  o1.connect(g1);g1.connect(c.frequency);o2.connect(g2);g2.connect(c.frequency);
  var env=ctx.createGain(),rel=ctx.createGain(),peak=.04+.36*Math.pow(vel,1.3);
  env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(peak,t+.003);env.gain.setTargetAtTime(0,t+.003,tau);
  c.connect(env);env.connect(rel);rel.connect(tone);
  var ns=ctx.createBufferSource();ns.buffer=noiseBuf;var bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=Math.min(2500,f*2+300);bp.Q.value=.9;
  var ng=ctx.createGain();ng.gain.setValueAtTime(.12*vel*vel,t);ng.gain.setTargetAtTime(0,t,.008);ns.connect(bp);bp.connect(ng);ng.connect(rel);
  c.start(t);o1.start(t);o2.start(t);ns.start(t);
  var end=t+tau*7+.5;c.stop(end);o1.stop(end);o2.stop(end);
  var v={c:c,o1:o1,o2:o2,rel:rel,f:f,down:true,held:false,gone:false};voices[m]=v;live.push(v);
  show(nm(m)+"  Anschlag "+Math.round(vel*127),vel);
}
function off(m){
  var v=voices[m];if(!v||!v.down)return;v.down=false;
  if(pedal)v.held=true;else relv(v);
}
function setPedal(p){
  pedal=p;S.sus=p;$("#sus").classList.toggle("on",p);
  if(!p)for(var m in voices){var v=voices[m];if(v&&!v.down&&v.held){v.held=false;relv(v)}}
}

// Anzeige
var tmo;
function show(txt,vel){$("#l1").textContent=txt;if(vel!=null)$("#vb").style.width=Math.round(vel*100)+"%";clearTimeout(tmo);tmo=setTimeout(function(){$("#vb").style.width="0"},900)}

// Tastatur (64 Tasten)
var kbd=$("#kbd"),keys={},nw=0;
for(var m=LO;m<=HI;m++)if([0,2,4,5,7,9,11].indexOf(m%12)>=0)nw++;
var ww=100/nw,wi=0;
for(var m=LO;m<=HI;m++){
  var isW=[0,2,4,5,7,9,11].indexOf(m%12)>=0,el=document.createElement("div");el.dataset.m=m;
  if(isW){el.className="k w";if(m%12===0)el.textContent=nm(m);kbd.appendChild(el);wi++}
  else{el.className="k bk";el.style.width=ww*.62+"%";el.style.left=(wi*ww-ww*.31)+"%";kbd.appendChild(el)}
  keys[m]=el;
}
var ptr={};
function vel(el,e){var r=el.getBoundingClientRect(),q=(e.clientY-r.top)/r.height;return Math.min(1,Math.max(.1,.1+.95*q))}
function press(el,e){var m=+el.dataset.m;el.classList.add("d");on(m,vel(el,e));return m}
function rls(id){var p=ptr[id];if(p==null)return;keys[p].classList.remove("d");off(p);delete ptr[id]}
kbd.addEventListener("pointerdown",function(e){var el=e.target.closest(".k");if(!el)return;e.preventDefault();try{kbd.setPointerCapture(e.pointerId)}catch(x){}ptr[e.pointerId]=press(el,e)});
kbd.addEventListener("pointermove",function(e){
  if(ptr[e.pointerId]==null)return;var el=document.elementFromPoint(e.clientX,e.clientY);el=el&&el.closest&&el.closest(".k");
  if(el&&+el.dataset.m!==ptr[e.pointerId]){rls(e.pointerId);ptr[e.pointerId]=press(el,e)}
});
["pointerup","pointercancel","lostpointercapture"].forEach(function(t){kbd.addEventListener(t,function(e){rls(e.pointerId)})});
kbd.addEventListener("contextmenu",function(e){e.preventDefault()});

// Drehregler
var CFG=[["vol","Lautstärke"],["tone","Klangfarbe"],["trem","Tremolo"],["rev","Hall"],["rep","Repeat"],["time","Repeat-Zeit"]];
var kn={};
CFG.forEach(function(c){
  var w=document.createElement("div");w.className="kw";var el=document.createElement("div");el.className="knob";el.tabIndex=0;el.setAttribute("role","slider");el.setAttribute("aria-label",c[1]);
  w.appendChild(el);w.appendChild(document.createTextNode(c[1]));$("#knobs").appendChild(w);
  function draw(){el.style.transform="rotate("+(-135+270*S[c[0]])+"deg)";el.setAttribute("aria-valuenow",Math.round(S[c[0]]*100))}
  function set(v){S[c[0]]=Math.max(0,Math.min(1,v));draw();apply();save();show(c[1]+"  "+Math.round(S[c[0]]*100)+" %")}
  var y0,v0,dr=false;
  el.addEventListener("pointerdown",function(e){ensure();dr=true;y0=e.clientY;v0=S[c[0]];el.setPointerCapture(e.pointerId)});
  el.addEventListener("pointermove",function(e){if(dr)set(v0+(y0-e.clientY)/150)});
  ["pointerup","pointercancel"].forEach(function(t){el.addEventListener(t,function(){dr=false})});
  el.addEventListener("wheel",function(e){e.preventDefault();set(S[c[0]]-Math.sign(e.deltaY)*.03)},{passive:false});
  el.addEventListener("keydown",function(e){var d={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1}[e.key];if(d){e.preventDefault();set(S[c[0]]+d*.05)}});
  draw();
});

// Schalter
function seg(id,key,conv2,after){
  var bs=document.querySelectorAll(id+" button");
  function mark(){bs.forEach(function(b){b.classList.toggle("on",conv2(b.dataset.v)===S[key])})}
  bs.forEach(function(b){b.addEventListener("click",function(){ensure();S[key]=conv2(b.dataset.v);mark();if(after)after();save()})});mark();
}
seg("#segType","type",String,function(){show("Klang: "+({rhodes:"Röhre",wurli:"Rohrblatt",glocke:"Glocke"})[S.type])});
seg("#segRoom","room",Number,function(){if(ctx)conv.buffer=ir(S.room);show("Raum: "+S.room+" s Nachhall")});
function oct(d){S.oct=Math.max(-2,Math.min(2,S.oct+d));show("Oktave "+(S.oct>0?"+":"")+S.oct);save()}
$("#oM").addEventListener("click",function(){oct(-1)});$("#oP").addEventListener("click",function(){oct(1)});
$("#sus").addEventListener("pointerdown",function(e){e.preventDefault();ensure();setPedal(!pedal)});
window.addEventListener("keydown",function(e){if(e.code==="Space"&&!e.repeat&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();setPedal(true)}});
window.addEventListener("keyup",function(e){if(e.code==="Space")setPedal(false)});

// MIDI (wo der Browser es erlaubt)
try{if(navigator.requestMIDIAccess)navigator.requestMIDIAccess().then(function(a){
  a.inputs.forEach(function(inp){inp.onmidimessage=function(e){
    var s=e.data[0]&0xf0,n=e.data[1],v=e.data[2];
    if(s===0x90&&v>0){if(keys[n])keys[n].classList.add("d");on(n,v/127)}
    else if(s===0x80||(s===0x90&&v===0)){if(keys[n])keys[n].classList.remove("d");off(n)}
    else if(s===0xB0&&n===64)setPedal(v>=64);
  }})
}).catch(function(){})}catch(e){}
})();
</script>
</body>
</html>
